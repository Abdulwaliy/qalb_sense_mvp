services:
  - type: web
    name: qalb-sense-mvp
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: QURAN_ENV
        value: prelive
      - key: QURAN_CLIENT_ID
        sync: false
      - key: QURAN_CLIENT_SECRET
        sync: false
